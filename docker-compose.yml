version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: jobanalytica_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=super_secure_production_jwt_secret_jobanalytica_2026
      - CORS_ORIGIN=http://localhost:3000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: jobanalytica_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    depends_on:
      - api
