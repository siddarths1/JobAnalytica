version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jobanalytica_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: jobanalytica
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: jobanalytica_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/jobanalytica?schema=public
      - JWT_SECRET=super_secure_production_jwt_secret_jobanalytica_2026
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: jobanalytica_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
