services:
  # Backend API Gateway
  - type: web
    name: jobanalytica-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm --filter api start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./data/prod.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: THROTTLE_TTL
        value: 60000
      - key: THROTTLE_LIMIT
        value: 100
    disk:
      name: api-data
      mountPath: /app/apps/api/data
      sizeGB: 1
