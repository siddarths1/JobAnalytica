databases:
  # Free Managed PostgreSQL Database on Render (Persistent 24/7, No Disk Required!)
  - name: jobanalytica-db
    plan: free
    region: oregon
    databaseName: jobanalytica
    user: jobanalytica_user

services:
  # 1. Backend API Gateway (NestJS)
  - type: web
    name: jobanalytica-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @jobanalytica/shared-types build && pnpm --filter api db:push && pnpm --filter api build
    startCommand: pnpm --filter api start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: jobanalytica-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: THROTTLE_TTL
        value: 60000
      - key: THROTTLE_LIMIT
        value: 100

  # 2. Frontend Web Application (Next.js 14+)
  - type: web
    name: jobanalytica-web
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @jobanalytica/shared-types build && pnpm --filter web build
    startCommand: pnpm --filter web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: jobanalytica-api
          property: host
